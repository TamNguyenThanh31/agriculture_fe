<form nz-form [formGroup]="cropForm" (ngSubmit)="submitForm()">
  <nz-form-item>
    <nz-form-label nzRequired nzFor="seasonName">Tên mùa vụ</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng điền tên mùa vụ">
      <input nz-input id="seasonName" formControlName="seasonName" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired nzFor="cropType">Loại cây trồng</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng điền loại cây trồng">
      <input nz-input id="cropType" formControlName="cropType" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired nzFor="area">Diện tích(m2)</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng điền thông tin diện tích">
      <input nz-input id="area" formControlName="area" type="number" placeholder="0.0" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired nzFor="plantingDate">Ngày gieo trồng</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng chọn ngày gieo trồng">
      <input nz-input id="plantingDate" formControlName="plantingDate" type="date" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired nzFor="expectedHarvestDate">Harvest Date</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng chọn ngày thu hoạch">
      <input nz-input id="expectedHarvestDate" formControlName="expectedHarvestDate" type="date" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired nzFor="status">Trạng thái</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng chọn trạng thái">
      <nz-select formControlName="status" id="status" placeholder="Chọn trạng thái">
        <nz-option *ngFor="let s of statusOptions" [nzValue]="s.value" [nzLabel]="s.label"></nz-option>
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <div class="form-actions">
    <button nz-button nzType="primary" [disabled]="cropForm.invalid">
      {{ isEditMode ? 'Cập nhật' : 'Thêm' }}
    </button>
    <button nz-button nzType="default" (click)="cancel()" type="button">
      Huỷ
    </button>
  </div>
</form>
