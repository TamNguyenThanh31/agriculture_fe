<nz-card
  nzTitle="Crop Seasons Management"
  nzBordered
  [nzExtra]="addButtonTemplate"
  class="modern-card"
>
  <nz-table
    [nzBordered]="true"
    [nzData]="cropSeasons"
    [nzLoading]="isLoading"
    [nzSize]="'middle'"
    [nzShowPagination]="false"
    class="crop-season-table"
  >
    <thead>
    <tr>
      <th nzWidth="25%">Season Name</th>
      <th nzWidth="15%">Crop Type</th>
      <th nzWidth="10%">Area (ha)</th>
      <th nzWidth="20%">Planting Date</th>
      <th nzWidth="20%">Harvest Date</th>
      <th nzWidth="20%">Status</th>
      <th nzWidth="10%">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let season of cropSeasons">
      <td>{{ season.seasonName }}</td>
      <td>{{ season.cropType }}</td>
      <td>{{ season.area }}</td>
      <td>{{ season.plantingDate | date: 'mediumDate' }}</td>
      <td>{{ season.expectedHarvestDate | date: 'mediumDate' }}</td>
      <td>
        <nz-tag
          [nzColor]="season.status === 'Active' ? 'green' : 'red'"
        >{{ season.status }}</nz-tag
        >
      </td>
      <td class="action-buttons">
        <button
          nz-button
          nzType="link"
          nzShape="circle"
          nz-tooltip="Edit Season"
          (click)="editSeason(season)"
        >
          <i nz-icon nzType="edit"></i>
        </button>
        <button
          nz-button
          nzType="link"
          nzShape="circle"
          nz-tooltip="Delete Season"
          (click)="deleteSeason(season.id)"
        >
          <i nz-icon nzType="delete"></i>
        </button>
        <button
          nz-button
          nzType="link"
          nzShape="circle"
          nz-tooltip="Manage Tasks"
          (click)="manageTasks(season.id)"
        >
          <i nz-icon nzType="bars"></i>
        </button>
      </td>
    </tr>
    </tbody>
  </nz-table>
</nz-card>

<!-- Nút thêm mới -->
<ng-template #addButtonTemplate>
  <button nz-button nzType="primary" class="add-button" (click)="createSeason()">
    <i nz-icon nzType="plus"></i> Add New Season
  </button>
</ng-template>
