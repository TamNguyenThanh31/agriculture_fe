<nz-card
  nzTitle="Crop Tasks Management"
  [nzExtra]="addTaskButtonTemplate"
  nzBordered
  class="modern-card"
>
  <nz-table
    [nzBordered]="true"
    [nzData]="cropTasks"
    [nzLoading]="isLoading"
    [nzSize]="'middle'"
    [nzShowPagination]="false"
    class="crop-task-table"
  >
    <thead>
    <tr>
      <th nzWidth="25%">Task Name</th>
      <th nzWidth="15%">Due Date</th>
      <th nzWidth="15%">Status</th>
      <th nzWidth="35%">Notes</th>
      <th nzWidth="10%">Cost</th>
      <th nzWidth="10%">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let task of cropTasks">
      <td>{{ task.taskName }}</td>
      <td>{{ task.dueDate | date: 'mediumDate' }}</td>
      <td>
        <nz-tag
          [nzColor]="task.status === 'PENDING' ? 'orange' : task.status === 'COMPLETED' ? 'green' : 'red'"
        >
          {{ task.status }}
        </nz-tag>
      </td>
      <td>{{ task.notes }}</td>
      <td>{{ task.cost | currency }}</td>
      <td class="action-buttons">
        <button
          nz-button
          nzType="link"
          nzShape="circle"
          nz-tooltip="Edit Task"
          (click)="editTask(task)"
        >
          <i nz-icon nzType="edit"></i>
        </button>
        <button
          nz-button
          nzType="link"
          nzShape="circle"
          nz-tooltip="Delete Task"
          (click)="deleteTask(task.id)"
        >
          <i nz-icon nzType="delete"></i>
        </button>
      </td>
    </tr>
    </tbody>
  </nz-table>
</nz-card>

<!-- Nút thêm mới -->
<ng-template #addTaskButtonTemplate>
  <button nz-button nzType="primary" class="add-button" (click)="createTask()">
    <i nz-icon nzType="plus"></i> Add New Task
  </button>
</ng-template>
