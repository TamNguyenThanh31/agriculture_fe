<nz-card
  nzTitle="Danh sách nhiệm vụ"
  [nzExtra]="addTaskButtonTemplate"
  nzBordered
  class="modern-card"
>
  <nz-table
    [nzBordered]="true"
    [nzData]="cropTasks"
    [nzLoading]="isLoading"
    [nzSize]="'middle'"
    [nzShowPagination]="false"
    class="crop-task-table"
  >
    <thead>
    <tr>
      <th nzWidth="25%">Tên nhiệm vụ</th>
      <th nzWidth="15%">Ngày hoàn thành</th>
      <th nzWidth="15%">Trạng thái</th>
      <th nzWidth="35%">Ghi chú</th>
      <th nzWidth="10%">Chi phí</th>
      <th nzWidth="10%">Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let task of cropTasks">
      <td>{{ task.taskName }}</td>
      <td>{{ task.dueDate | date: 'mediumDate' }}</td>
      <td>
        <nz-tag
          [nzColor]="task.status === 'PENDING' ? 'orange' : task.status === 'COMPLETED' ? 'green' : 'red'"
        >
          {{ task.status }}
        </nz-tag>
      </td>
      <td>{{ task.notes }}</td>
      <td>{{ task.cost | number: '1.0-2' }} ₫</td>
      <td class="action-buttons">
        <button
          nz-button
          nzType="link"
          nzShape="circle"
          nz-tooltip="Chỉnh sửa nhiệm vụ"
          (click)="editTask(task)"
        >
          <i nz-icon nzType="edit"></i>
        </button>
        <button
          nz-button
          nzType="link"
          nzShape="circle"
          nz-tooltip="Xoá nhiệm vụ"
          (click)="deleteTask(task.id)"
        >
          <i nz-icon nzType="delete"></i>
        </button>
      </td>
    </tr>
    </tbody>
  </nz-table>
</nz-card>

<!-- Nút thêm mới -->
<ng-template #addTaskButtonTemplate>
  <button
    nz-button
    nzType="primary"
    class="add-button"
    (click)="createTask()"
    style="background-color: #81c784; border: none;"
  >
    <i nz-icon nzType="plus"></i> Thêm nhiệm vụ
  </button>
  <button
    nz-button
    nzType="primary"
    class="back-button"
    (click)="backToSeason()"
    style="margin-left: 6px; background-color: #a5d6a7; border: none;"
  >
    <nz-icon nzType="left"></nz-icon>
    Quay lại
  </button>
</ng-template>
