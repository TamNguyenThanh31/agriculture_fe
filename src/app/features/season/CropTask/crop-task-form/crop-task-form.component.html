<form nz-form [formGroup]="taskForm" (ngSubmit)="submitForm()">
  <nz-form-item>
    <nz-form-label nzRequired nzFor="taskName">Task Name</nz-form-label>
    <nz-form-control nzErrorTip="Please enter task name">
      <input nz-input id="taskName" formControlName="taskName" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired nzFor="dueDate">Due Date</nz-form-label>
    <nz-form-control nzErrorTip="Please select due date">
      <input nz-input id="dueDate" formControlName="dueDate" type="date" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired nzFor="status">Status</nz-form-label>
    <nz-form-control nzErrorTip="Please select status">
      <nz-select formControlName="status" id="status" placeholder="Select status">
        <nz-option *ngFor="let s of statusOptions" [nzValue]="s.value" [nzLabel]="s.label"></nz-option>
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzFor="notes">Notes</nz-form-label>
    <nz-form-control>
      <textarea nz-input id="notes" formControlName="notes"></textarea>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired nzFor="cost">Cost</nz-form-label>
    <nz-form-control nzErrorTip="Please enter cost">
      <input nz-input id="cost" formControlName="cost" type="number" placeholder="0.0" />
    </nz-form-control>
  </nz-form-item>

  <div class="form-actions">
    <button nz-button nzType="primary" [disabled]="taskForm.invalid">
      {{ isEditMode ? 'Update' : 'Create' }}
    </button>
    <button nz-button nzType="default" (click)="cancel()" type="button">
      Cancel
    </button>
  </div>
</form>
