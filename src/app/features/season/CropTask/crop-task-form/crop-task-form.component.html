<form nz-form [formGroup]="taskForm" (ngSubmit)="submitForm()">
  <nz-form-item>
    <nz-form-label nzRequired nzFor="taskName">Tên nhiệm vụ</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng chọn tên nhiệm vụ">
      <input nz-input id="taskName" formControlName="taskName" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired nzFor="dueDate">Ngày hoàn thành</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng chọn ngày hoàn thành">
      <input nz-input id="dueDate" formControlName="dueDate" type="date" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired nzFor="status">Trạng thái</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng chọn trạng thái">
      <nz-select formControlName="status" id="status" placeholder="Select status">
        <nz-option *ngFor="let s of statusOptions" [nzValue]="s.value" [nzLabel]="s.label"></nz-option>
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzFor="notes">Ghi chú</nz-form-label>
    <nz-form-control>
      <textarea nz-input id="notes" formControlName="notes"></textarea>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired nzFor="cost">Chi phí</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng nhập chi phí">
      <input nz-input id="cost" formControlName="cost" type="number" placeholder="0.0" />
    </nz-form-control>
  </nz-form-item>

  <div class="form-actions">
    <button nz-button nzType="primary" [disabled]="taskForm.invalid">
      {{ isEditMode ? 'Cập nhật' : 'Thêm' }}
    </button>
    <button nz-button nzType="default" (click)="cancel()" type="button">
      Huỷ
    </button>
  </div>
</form>
