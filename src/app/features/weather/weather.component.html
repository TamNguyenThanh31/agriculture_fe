<nz-card nzTitle="Dự báo thời tiết" nzBordered>
  <!-- Input tìm kiếm thành phố -->
  <div class="search-container">
    <div class="search-box">
      <nz-input-group nzPrefixIcon="search">
        <input
          nz-input
          placeholder="Nhập tên thành phố"
          [(ngModel)]="city"
        />
      </nz-input-group>
      <button
        nz-button
        nzType="primary"
        (click)="fetchWeatherAndForecast()"
        [disabled]="!city"
        class="search-button"
        style="display: flex; justify-content: center; align-items: center;"
      >
        Tìm kiếm
      </button>
    </div>
  </div>

  <!-- Hiển thị Skeleton Loader khi đang tải -->
  <div *ngIf="isLoading" class="skeleton-container">
    <div class="skeleton-card" *ngFor="let i of [1, 2, 3, 4, 5]">
      <div class="skeleton-header"></div>
      <div class="skeleton-body"></div>
      <div class="skeleton-footer"></div>
    </div>
  </div>

  <!-- Hiển thị nội dung khi đã tải xong -->
  <ng-container *ngIf="!isLoading && weatherData">
    <!-- Hiển thời tiết 5 ngày -->
    <div class="forecast-info">
      <div class="forecast-cards">
        <nz-card
          *ngFor="let forecast of filteredForecast"
          [nzBordered]="false"
          [nzHoverable]="true"
          class="forecast-card"
        >
          <div class="card-content">
            <div class="card-header">
              <span class="date">{{ forecast.dt * 1000 | date: 'EEE, MMM d' }}</span>
            </div>
            <div class="card-body">
              <img
                [ngSrc]="getWeatherIcon(forecast.weather[0].icon)"
                alt="{{ forecast.weather[0].description }}"
                width="50"
                height="50"
                class="weather-icon"
              />
              <div class="weather-details">
                <p class="temp">{{ forecast.main.temp | number: '1.0-0' }}°C</p>
                <p class="desc">{{ forecast.weather[0].description }}</p>
              </div>
            </div>
            <div class="card-footer">
              <span>Humidity: {{ forecast.main.humidity }}%</span>
            </div>
          </div>
        </nz-card>
      </div>
    </div>

    <!-- Nút hiển thị/ẩn biểu đồ -->
    <button class="agriculture-button" (click)="toggleWeatherChart()">
      <span *ngIf="!showWeatherChart">Hiển thị biểu đồ</span>
      <span *ngIf="showWeatherChart">Ẩn biểu đồ</span>
    </button>

    <!-- Biểu đồ thời tiết -->
    <div *ngIf="showWeatherChart">
      <app-dashboard-weather [weatherData]="filteredForecast"></app-dashboard-weather>
    </div>
  </ng-container>
</nz-card>
