<div class="card-wrapper">
  <nz-card nzBordered="false" nzTitle="Temperature Forecast">
    <canvas
      baseChart
      [data]="tempChartData"
      [options]="tempChartOptions"
      [type]="tempChartType"
    ></canvas>
  </nz-card>

  <nz-card nzBordered="false" nzTitle="Humidity Forecast" class="mt-4">
    <canvas
      baseChart
      [data]="humidityChartData"
      [options]="humidityChartOptions"
      [type]="humidityChartType"
    ></canvas>
  </nz-card>
</div>
