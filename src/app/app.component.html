<nz-layout class="app-layout">
  <nz-sider
    class="menu-sidebar"
    nzCollapsible
    nzWidth="256px"
    nzBreakpoint="md"
    [(nzCollapsed)]="isCollapsed"
    [nzTrigger]="null"
  >
    <div class="sidebar-logo">
      <a href="" target="_blank">
        <img src="assets/images/icon_agriculture.png" alt="logo">
        <h1>Agriculture Management</h1>
      </a>
    </div>
    <ul nz-menu nzTheme="dark" nzMode="inline" [nzInlineCollapsed]="isCollapsed">
      <li nz-menu-item nzMatchRouter>
        <i nz-icon nzType="menu"></i>
        <span>Welcome</span>
        <a routerLink="/welcome"></a>
      </li>
      <li nz-menu-item nzMatchRouter>
        <i nz-icon nzType="appstore"></i>
        <span>Season</span>
        <a routerLink="/season"></a>
      </li>
      <li nz-menu-item nzMatchRouter>
        <i nz-icon nzType="area-chart"></i>
        <span>Dashboard</span>
        <a routerLink="/dashboard"></a>
      </li>
      <li nz-menu-item nzMatchRouter>
        <i nz-icon nzType="sun"></i>
        <span>Weather</span>
        <a routerLink="/weather"></a>
      </li>
      <li nz-menu-item nzMatchRouter>
        <i nz-icon nzType="open-a-i"></i>
        <span>Chatbot</span>
        <a routerLink="/chatbot"></a>
      </li>
      <li nz-menu-item nzMatchRouter>
        <i nz-icon nzType="area-chart"></i>
        <span>Superset</span>
        <a href="http://82.112.237.22:8088/superset/dashboard/17/?native_filters_key=_qCfmMFfoXj3-MJyrQHPod3BS9o-zR6iiSQvbN7gl74PIuOfU317pSR7-0QYhN_z" target="_blank">
        </a>
      </li>
      <li nz-menu-item nzMatchRouter>
        <i nz-icon nzType="message"></i>
        <span>ChatBot Telegram</span>
        <a href="https://t.me/AgTLU_bot" target="_blank"></a>
      </li>

    </ul>
  </nz-sider>
  <nz-layout>
    <nz-header>
      <div class="app-header">
        <span class="header-trigger" (click)="isCollapsed = !isCollapsed">
          <nz-icon class="trigger" [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'"></nz-icon>
        </span>
      </div>
    </nz-header>
    <nz-content class="content-scroll">
      <div class="inner-content">
        <router-outlet></router-outlet>
      </div>
    </nz-content>
  </nz-layout>
</nz-layout>
